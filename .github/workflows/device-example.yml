name: Device example CI

on:
  pull_request:
    paths:
      - 'device-example/**'
      - '.github/workflows/device-example.yml'
  push:
    branches:
      - main
    paths:
      - 'device-example/**'
      - '.github/workflows/device-example.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stage:
          - stage-5-tests-ci
          - stage-6-api-ui
          - stage-7-docker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the package and test dependencies
        run: python -m pip install -e './device-example/${{ matrix.stage }}/backend[dev]'
      - name: Run the tests
        run: python -m pytest device-example/${{ matrix.stage }}/backend

  docker-comparison:
    name: Docker output comparison (stage 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the package for the local run
        run: python -m pip install -e './device-example/stage-7-docker/backend'
      - name: Start the local API
        run: |
          python -m uvicorn app.main:app --app-dir device-example/stage-7-docker/backend --port 8001 &
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8001/health
      - name: Start both services with Docker Compose
        working-directory: device-example/stage-7-docker
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Compare local and Docker limit dates
        run: python device-example/stage-7-docker/compare_limit_dates.py http://127.0.0.1:8001 http://127.0.0.1:8000
      - name: Stop Compose services
        if: always()
        working-directory: device-example/stage-7-docker
        run: docker compose down
