services:
  backend:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: https://github.com/drweihungpan-lab/3R-frontend.git#v1.0.0
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
