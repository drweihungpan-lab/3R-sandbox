[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "device-limit"
version = "0.5.0"
description = "Predict the date each medical device reaches its usage limit (synthetic data)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["device_limit*"]
